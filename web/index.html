<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yuk joylash</title>
<meta name="description" content="Mebel upakovkalarini mashinaga joylash: nechta sig'adi, necha kg / tonna.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='9' width='19' height='14' rx='2' fill='%231f5fbf'/%3E%3Cpath d='M21 13h5l4 5v5h-9z' fill='%23384250'/%3E%3Ccircle cx='9' cy='25' r='3' fill='%23222'/%3E%3Ccircle cx='25' cy='25' r='3' fill='%23222'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<header class="bosh">
  <h1>Yuk joylash</h1>
  <span class="izoh">Mebel upakovkalari mashinada</span>
</header>
<main class="joy">
  <aside class="panel">
    <section class="blok">
      <h2>Buyurtmalar</h2>
      <div class="qator">
        <label class="tugma asosiy">Fayl qo'shish (.yuk)
          <input type="file" data-test="fayl" accept=".yuk,.json" multiple hidden>
        </label>
        <button class="tugma" data-test="namuna" type="button">Namuna</button>
      </div>
      <p class="xato" data-test="xato" hidden></p>
      <ul class="buyurtmalar" data-test="buyurtmalar"></ul>
      <p class="bosh-holat" data-test="bosh">Bazis "Upakovka" skripti yaratgan .yuk faylini qo'shing.</p>
    </section>

    <section class="blok">
      <h2>Mashina</h2>
      <div class="qator">
        <select data-test="mashina" aria-label="Mashina"></select>
        <button class="tugma" data-test="oz-ochish" type="button">+ O'z mashinam</button>
      </div>
      <p class="olcham" data-test="mashina-olcham"></p>
      <button class="tugma kichik xavfli" data-test="oz-ochir" type="button" hidden>Bu mashinani o'chirish</button>
      <form class="oz" data-test="oz-forma" hidden>
        <label>Nomi <input name="nomi" required maxlength="30" placeholder="Kamaz"></label>
        <div class="uchta">
          <label>Uzunlik, mm <input name="L" type="number" required min="300" max="20000" inputmode="numeric"></label>
          <label>Eni, mm <input name="W" type="number" required min="300" max="4000" inputmode="numeric"></label>
          <label>Balandlik, mm <input name="H" type="number" required min="300" max="4000" inputmode="numeric"></label>
        </div>
        <label>Yuk ko'tarishi, kg <input name="maxKg" type="number" required min="50" max="60000" inputmode="numeric"></label>
        <div class="qator">
          <button class="tugma asosiy" type="submit">Saqlash</button>
          <button class="tugma" data-test="oz-bekor" type="button">Bekor</button>
        </div>
      </form>
    </section>

    <section class="blok natija" data-test="natija">
      <h2>Natija</h2>
      <div class="korsatkich">
        <span class="yorliq">Sig'di</span>
        <strong data-test="sigdi">—</strong>
      </div>
      <div class="korsatkich">
        <span class="yorliq">Og'irlik</span>
        <strong data-test="ogirlik">—</strong>
      </div>
      <div class="chiziq"><i data-test="ogirlik-chiziq"></i></div>
      <div class="korsatkich">
        <span class="yorliq">Hajm to'lishi</span>
        <strong data-test="hajm">—</strong>
      </div>
      <div class="chiziq"><i data-test="hajm-chiziq"></i></div>
      <p class="tavsiya" data-test="tavsiya"></p>
      <ul class="sigmadi" data-test="sigmadi"></ul>
      <div class="qator">
        <button class="tugma" data-test="nechta" type="button">Nechta sig'adi?</button>
        <button class="tugma asosiy" data-test="varaqa-ochish" type="button">Yuklash varaqasi</button>
      </div>
      <p class="nechta" data-test="nechta-natija"></p>
    </section>
  </aside>

  <section class="sahna-joy">
    <div class="sahna" data-test="canvas"></div>
    <p class="sahna-bosh" data-test="sahna-bosh">Fayl qo'shing yoki "Namuna" tugmasini bosing.</p>
    <div class="hud" data-test="hud" hidden></div>
    <div class="korinishlar" role="group" aria-label="Ko'rinish">
      <button class="chip" data-korinish="3d" type="button">3D</button>
      <button class="chip" data-korinish="eshik" type="button">Eshikdan</button>
      <button class="chip" data-korinish="yon" type="button">Yon</button>
      <button class="chip" data-korinish="tepa" type="button">Tepa</button>
      <button class="chip" data-test="kuzat" type="button" aria-pressed="true">Kamera kuzatsin</button>
    </div>
    <div class="pleyer" data-test="pleyer">
      <input type="range" min="0" max="0" value="0" step="1" data-test="surgich" aria-label="Yuklash bosqichi">
      <div class="pleyer-qator">
        <button class="tugma kichik" data-test="boshiga" type="button" aria-label="Boshiga">⏮</button>
        <button class="tugma kichik" data-test="orqaga" type="button" aria-label="Oldingi quti">◀</button>
        <button class="tugma asosiy oyna" data-test="oyna" type="button" aria-label="Yuklashni ko'rsatish">▶ Yuklash</button>
        <button class="tugma kichik" data-test="oldinga" type="button" aria-label="Keyingi quti">▶</button>
        <button class="tugma kichik" data-test="hammasi" type="button" aria-label="Hammasi">⏭</button>
        <span class="qadam" data-test="qadam">0 / 0</span>
        <select data-test="tezlik" aria-label="Tezlik">
          <option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option>
        </select>
      </div>
    </div>
    <div class="popup" data-test="popup" hidden></div>
  </section>
</main>
<div class="varaqa-fon" data-test="varaqa" hidden>
  <div class="varaqa">
    <div class="varaqa-tugmalar">
      <button class="tugma asosiy" data-test="chop" type="button">Chop etish / PDF</button>
      <button class="tugma" data-test="varaqa-yop" type="button">Yopish</button>
    </div>
    <div data-test="varaqa-ichi"></div>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
